name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/frontend/**'
      - 'apps/mirror-os-app/**'
      - '.github/workflows/typescript-ci.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: typescript-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: dashboard
            path: apps/dashboard/frontend
          - name: mirror-os-app
            path: apps/mirror-os-app
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ matrix.app.path }}
        run: |
          npm ci --prefer-offline --no-audit
      
      - name: Lint
        working-directory: ${{ matrix.app.path }}
        run: |
          npm run lint || true
        continue-on-error: true
      
      - name: Type check
        working-directory: ${{ matrix.app.path }}
        run: |
          npm run type-check || npx tsc --noEmit || true

  build-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
        app:
          - name: dashboard
            path: apps/dashboard/frontend
          - name: mirror-os-app
            path: apps/mirror-os-app
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm ci --prefer-offline --no-audit
      
      - name: Run tests
        working-directory: ${{ matrix.app.path }}
        run: npm test -- --passWithNoTests --coverage || true
        continue-on-error: true
      
      - name: Build
        working-directory: ${{ matrix.app.path }}
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Upload build artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-build
          path: |
            ${{ matrix.app.path }}/.next
            ${{ matrix.app.path }}/dist
            ${{ matrix.app.path }}/build
          retention-days: 7

  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: apps/dashboard/frontend
        run: npm ci --prefer-offline --no-audit
      
      - name: Analyze bundle
        working-directory: apps/dashboard/frontend
        run: |
          npm run build
          npx @next/bundle-analyzer || true
        continue-on-error: true

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: apps/dashboard/frontend
        run: |
          npm ci --prefer-offline --no-audit
          npx playwright install --with-deps chromium
      
      - name: Build app
        working-directory: apps/dashboard/frontend
        run: npm run build
      
      - name: Run Playwright tests
        working-directory: apps/dashboard/frontend
        run: |
          # Only run if playwright tests exist
          if [ -d "e2e" ] || [ -d "tests/e2e" ]; then
            npx playwright test || true
          else
            echo "No e2e tests found, skipping"
          fi
        continue-on-error: true
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dashboard/frontend/playwright-report/
          retention-days: 7