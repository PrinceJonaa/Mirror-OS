name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/frontend/**'
      - 'apps/mirror-os-app/**'
      - '.github/workflows/typescript-ci.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: typescript-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: dashboard
            path: apps/dashboard/frontend
          - name: mirror-os-app
            path: apps/mirror-os-app
    steps:
      - uses: actions/checkout@v6
      
      - name: Check if app exists
        id: check_app
        run: |
          if [ -d "${{ matrix.app.path }}" ] && [ -f "${{ matrix.app.path }}/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✓ Found ${{ matrix.app.name }} at ${{ matrix.app.path }}"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  ${{ matrix.app.name }} not found at ${{ matrix.app.path }}"
          fi
      
      - name: Setup Node.js
        if: steps.check_app.outputs.exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      
      - name: Install dependencies
        if: steps.check_app.outputs.exists == 'true'
        working-directory: ${{ matrix.app.path }}
        run: |
          # Try npm ci first, fall back to npm install
          npm ci --prefer-offline --no-audit 2>/dev/null || npm install --prefer-offline --no-audit || npm install
      
      - name: Lint
        if: steps.check_app.outputs.exists == 'true'
        working-directory: ${{ matrix.app.path }}
        run: |
          npm run lint || echo "⚠️  Linting not configured or failed"
        continue-on-error: true
      
      - name: Type check
        if: steps.check_app.outputs.exists == 'true'
        working-directory: ${{ matrix.app.path }}
        run: |
          npm run type-check 2>/dev/null || npx tsc --noEmit 2>/dev/null || echo "⚠️  Type checking not configured or failed"
        continue-on-error: true

  build-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        app:
          - name: dashboard
            path: apps/dashboard/frontend
          - name: mirror-os-app
            path: apps/mirror-os-app
    steps:
      - uses: actions/checkout@v6
      
      - name: Check if app exists
        id: check_app
        run: |
          if [ -d "${{ matrix.app.path }}" ] && [ -f "${{ matrix.app.path }}/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js ${{ matrix.node-version }}
        if: steps.check_app.outputs.exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install dependencies
        if: steps.check_app.outputs.exists == 'true'
        working-directory: ${{ matrix.app.path }}
        run: |
          npm ci --prefer-offline --no-audit 2>/dev/null || npm install --prefer-offline --no-audit || npm install
      
      - name: Run tests
        if: steps.check_app.outputs.exists == 'true'
        working-directory: ${{ matrix.app.path }}
        run: |
          npm test -- --passWithNoTests --coverage 2>/dev/null || echo "⚠️  Tests not configured or failed"
        continue-on-error: true
      
      - name: Build
        if: steps.check_app.outputs.exists == 'true'
        working-directory: ${{ matrix.app.path }}
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Cleanup and check for zombie processes
        if: always()
        run: |
          echo "=== Checking for zombie processes ==="
          ps aux | grep -E "node|npm|jest|playwright" | grep -v grep || echo "No lingering processes"
          
          echo "=== Final disk usage ==="
          df -h
          du -sh apps/*/node_modules 2>/dev/null || true
      
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-node-${{ matrix.node-version }}-${{ matrix.app.name }}
          path: |
            ${{ matrix.app.path }}/dist
            ${{ matrix.app.path }}/build
            ${{ matrix.app.path }}/.next
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      
      - name: Check if dashboard exists
        id: check_dashboard
        run: |
          if [ -d "apps/dashboard/frontend" ] && [ -f "apps/dashboard/frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        if: steps.check_dashboard.outputs.exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      
      - name: Install dependencies
        if: steps.check_dashboard.outputs.exists == 'true'
        working-directory: apps/dashboard/frontend
        run: npm ci --prefer-offline --no-audit || npm install
      
      - name: Analyze bundle
        if: steps.check_dashboard.outputs.exists == 'true'
        working-directory: apps/dashboard/frontend
        run: |
          npm run build
          npx @next/bundle-analyzer || echo "Bundle analysis not available"
        continue-on-error: true

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      
      - name: Check if dashboard exists
        id: check_dashboard
        run: |
          if [ -d "apps/dashboard/frontend" ] && [ -f "apps/dashboard/frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        if: steps.check_dashboard.outputs.exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      
      - name: Install dependencies
        if: steps.check_dashboard.outputs.exists == 'true'
        working-directory: apps/dashboard/frontend
        run: |
          npm ci --prefer-offline --no-audit || npm install
          npx playwright install --with-deps chromium
      
      - name: Build app
        if: steps.check_dashboard.outputs.exists == 'true'
        working-directory: apps/dashboard/frontend
        run: npm run build
      
      - name: Run Playwright tests
        if: steps.check_dashboard.outputs.exists == 'true'
        working-directory: apps/dashboard/frontend
        run: |
          if [ -d "e2e" ] || [ -d "tests/e2e" ]; then
            npx playwright test || echo "E2E tests failed"
          else
            echo "⚠️  No e2e tests found, skipping"
          fi
        continue-on-error: true
      
      - name: Upload Playwright report
        if: always() && steps.check_dashboard.outputs.exists == 'true' && hashFiles('apps/dashboard/frontend/playwright-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/dashboard/frontend/playwright-report/
          retention-days: 7
          if-no-files-found: warn