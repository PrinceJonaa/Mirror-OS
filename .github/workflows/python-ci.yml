name: Python CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/relational-analyzer/**/*.py'
      - 'apps/agents/**/*.py'
      - 'research/training/**/*.py'
      - '**/requirements*.txt'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy black isort
      
      - name: Run ruff
        run: |
          ruff check apps/relational-analyzer apps/agents research/training --output-format=github
      
      - name: Check formatting with black
        run: |
          black --check apps/relational-analyzer apps/agents research/training || true
      
      - name: Check import sorting
        run: |
          isort --check-only apps/relational-analyzer apps/agents research/training || true
      
      - name: Type check with mypy
        run: |
          mypy apps/relational-analyzer/src --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-latest]
        include:
          - python-version: '3.12'
            os: macos-latest
          - python-version: '3.12'
            os: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            apps/relational-analyzer/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-benchmark
          
          # Install project dependencies
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f apps/relational-analyzer/requirements.txt ]; then 
            cd apps/relational-analyzer && pip install -r requirements.txt
            cd ../..
          fi
        shell: bash
      
      - name: Run tests with coverage
        run: |
          pytest apps/relational-analyzer/tests \
            -v \
            --cov=apps/relational-analyzer/src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --junitxml=pytest-results.xml \
            --maxfail=5 \
            --durations=10 \
            -n auto
        continue-on-error: ${{ matrix.python-version == '3.13' }}
      
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: python-${{ matrix.python-version }}
          fail_ci_if_error: false
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            pytest-results.xml
            htmlcov/
            .coverage
          retention-days: 30
      
      - name: Publish test results
        if: always() && matrix.os == 'ubuntu-latest'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: pytest-results.xml
          check_name: Test Results (Python ${{ matrix.python-version }})

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cd apps/relational-analyzer && pip install -r requirements.txt
      
      - name: Run relational analyzer on test data
        run: |
          cd apps/relational-analyzer
          if [ -f test_simple.csv ]; then
            python src/truth_distortion_unified.py \
              --data test_simple.csv \
              --out results/integration_test \
              --config '{"adj_threshold": 0.3}' || true
          fi
        timeout-minutes: 10