name: Python CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/relational-analyzer/**/*.py'
      - 'apps/agents/**/*.py'
      - 'research/training/**/*.py'
      - '**/requirements*.txt'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_WARN_SCRIPT_LOCATION: '1'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1  # Shallow clone for speed
      
      - name: Check disk space
        run: |
          df -h
          FREE_SPACE=$(df / | tail -1 | awk '{print $4}' | sed 's/G//')
          if (( $(echo "$FREE_SPACE < 5" | bc -l) )); then
            echo "⚠️  Low disk space: ${FREE_SPACE}GB"
          fi
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      
      - name: Clear corrupted pip cache (if any)
        run: |
          if [ -d ~/.cache/pip ]; then
            find ~/.cache/pip -type f -size 0 -delete 2>/dev/null || true
          fi
      
      - name: Install linting tools with retry
        run: |
          python -m pip install --upgrade pip
          
          for i in {1..3}; do
            if pip install ruff mypy black isort --timeout=60; then
              break
            elif [ $i -lt 3 ]; then
              echo "⚠️  Install attempt $i failed, retrying..."
              sleep 5
            else
              echo "❌ Failed to install after 3 attempts"
              exit 1
            fi
          done
      
      - name: Discover Python files
        id: discover
        run: |
          # Find Python files, handling unicode and special characters
          PYTHON_DIRS=("apps/relational-analyzer" "apps/agents" "research/training")
          HAS_FILES=false
          
          for dir in "${PYTHON_DIRS[@]}"; do
            if [ -d "$dir" ] && find "$dir" -name "*.py" -print -quit | grep -q .; then
              HAS_FILES=true
              break
            fi
          done
          
          echo "has_files=$HAS_FILES" >> $GITHUB_OUTPUT
      
      - name: Run ruff
        if: steps.discover.outputs.has_files == 'true'
        run: |
          ruff check apps/relational-analyzer apps/agents research/training \
            --output-format=github \
            --no-cache \
            || echo "⚠️  Ruff found issues"
        continue-on-error: true
      
      - name: Check formatting with black
        if: steps.discover.outputs.has_files == 'true'
        run: |
          black --check apps/relational-analyzer apps/agents research/training \
            || echo "⚠️  Black found formatting issues"
        continue-on-error: true
      
      - name: Check import sorting
        if: steps.discover.outputs.has_files == 'true'
        run: |
          isort --check-only apps/relational-analyzer apps/agents research/training \
            || echo "⚠️  Isort found issues"
        continue-on-error: true
      
      - name: Type check with mypy
        if: steps.discover.outputs.has_files == 'true'
        run: |
          if [ -d "apps/relational-analyzer/src" ]; then
            mypy apps/relational-analyzer/src \
              --ignore-missing-imports \
              --no-error-summary \
              --cache-dir=/tmp/mypy_cache \
              || echo "⚠️  Mypy found type issues"
          fi
        continue-on-error: true

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        os: [ubuntu-latest]
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      
      - name: Check available resources
        run: |
          echo "=== Disk Space ==="
          df -h
          echo "=== Memory ==="
          free -h || vm_stat || true
          echo "=== CPU ==="
          nproc || sysctl -n hw.ncpu || true
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      
      - name: Clear pip cache if corrupted
        run: |
          # Remove zero-byte files from cache
          if [ -d ~/.cache/pip ]; then
            find ~/.cache/pip -type f -size 0 -delete 2>/dev/null || true
            find ~/.cache/pip -type d -empty -delete 2>/dev/null || true
          fi
      
      - name: Install dependencies with retry and fallback
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-json-report
          
          # Install relational analyzer dependencies
          if [ -f apps/relational-analyzer/requirements.txt ]; then
            echo "📦 Installing relational-analyzer requirements..."
            cd apps/relational-analyzer
            
            # Try normal install
            if pip install -r requirements.txt --timeout=120; then
              echo "✅ Dependencies installed successfully"
            # Try without cache
            elif pip install -r requirements.txt --no-cache-dir --timeout=120; then
              echo "✅ Dependencies installed (no cache)"
            # Try one package at a time
            else
              echo "⚠️  Attempting individual package install..."
              while IFS= read -r package; do
                # Skip empty lines and comments
                [[ -z "$package" || "$package" =~ ^# ]] && continue
                pip install "$package" --timeout=60 || echo "⚠️  Failed: $package"
              done < requirements.txt
            fi
            
            cd ../..
          else
            echo "ℹ️  No requirements.txt found"
          fi
        shell: bash
        continue-on-error: false
      
      - name: Verify test directory
        id: check_tests
        run: |
          TEST_DIR="apps/relational-analyzer/tests"
          
          if [ ! -d "$TEST_DIR" ]; then
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No test directory found"
            exit 0
          fi
          
          # Count Python test files
          TEST_COUNT=$(find "$TEST_DIR" -name "test_*.py" -o -name "*_test.py" | wc -l)
          
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No test files found"
          else
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "✅ Found $TEST_COUNT test file(s)"
          fi
      
      - name: Run tests with coverage
        if: steps.check_tests.outputs.has_tests == 'true'
        run: |
          # Set resource limits to prevent runaway processes
          ulimit -v 4194304 2>/dev/null || true  # 4GB virtual memory limit
          
          pytest apps/relational-analyzer/tests \
            -v \
            --cov=apps/relational-analyzer/src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --junitxml=pytest-results.xml \
            --json-report \
            --json-report-file=pytest-report.json \
            --maxfail=5 \
            --durations=10 \
            --timeout=300 \
            -n auto \
            --dist=loadfile \
            || echo "⚠️  Some tests failed"
        timeout-minutes: 20
        continue-on-error: true
      
      - name: Create stub coverage if no tests
        if: steps.check_tests.outputs.has_tests == 'false'
        run: |
          echo '<?xml version="1.0" ?><coverage version="6.0"><packages/></coverage>' > coverage.xml
          echo "ℹ️  Created stub coverage report"
      
      - name: Check for zombie processes
        if: always()
        run: |
          ps aux | grep -E 'pytest|python' | grep -v grep || echo "No lingering processes"
      
      - name: Upload test results
        if: always() && (hashFiles('pytest-results.xml') != '' || hashFiles('pytest-report.json') != '')
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            pytest-results.xml
            pytest-report.json
            htmlcov/
            .coverage
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
      
      - name: Publish test results
        if: always() && matrix.os == 'ubuntu-latest' && hashFiles('pytest-results.xml') != ''
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: pytest-results.xml
          check_name: Test Results (Python ${{ matrix.python-version }})
        continue-on-error: true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      
      - name: Install dependencies with fallback
        run: |
          python -m pip install --upgrade pip
          
          if [ -f apps/relational-analyzer/requirements.txt ]; then
            cd apps/relational-analyzer
            pip install -r requirements.txt --timeout=120 || \
            pip install -r requirements.txt --no-cache-dir --timeout=120 || \
            echo "⚠️  Failed to install all dependencies"
            cd ../..
          fi
        continue-on-error: true
      
      - name: Run relational analyzer on test data
        run: |
          ANALYZER="apps/relational-analyzer"
          TEST_DATA="$ANALYZER/test_simple.csv"
          OUTPUT_DIR="$ANALYZER/results/integration_test"
          
          if [ ! -d "$ANALYZER" ]; then
            echo "ℹ️  Relational analyzer not found"
            exit 0
          fi
          
          if [ ! -f "$TEST_DATA" ]; then
            echo "ℹ️  Test data not found, skipping integration test"
            exit 0
          fi
          
          mkdir -p "$OUTPUT_DIR"
          
          cd "$ANALYZER"
          timeout 600 python src/truth_distortion_unified.py \
            --data test_simple.csv \
            --out results/integration_test \
            --config '{"adj_threshold": 0.3}' \
            || echo "⚠️  Integration test completed with warnings"
        timeout-minutes: 15
        continue-on-error: true