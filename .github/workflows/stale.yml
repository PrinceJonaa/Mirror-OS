name: Close Stale Issues

on:
  schedule:
    - cron: '0 0 * * *'  # Daily

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v8
        with:
          stale-issue-message: 'This issue has been inactive for 60 days and will close in 7 days unless there is activity.'
          stale-pr-message: 'This PR has been inactive for 30 days and will close in 7 days unless there is activity.'
          days-before-stale: 60
          days-before-close: 7