name: Update Dependencies

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 3am
  workflow_dispatch:
    inputs:
      target:
        description: 'Update target (python/node/both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - python
          - node

permissions:
  contents: write
  pull-requests: write

jobs:
  update-python:
    name: Update Python Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.target == 'both' || github.event.inputs.target == 'python'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip pip-tools
      
      - name: Update Python dependencies
        run: |
          # Update root requirements if .in file exists
          if [ -f requirements.in ]; then
            pip-compile requirements.in --upgrade --resolver=backtracking
          fi
          
          # Update relational-analyzer requirements
          if [ -f apps/relational-analyzer/requirements.in ]; then
            cd apps/relational-analyzer
            pip-compile requirements.in --upgrade --resolver=backtracking
            cd ../..
          fi
      
      - name: Test updated dependencies
        run: |
          pip install -r requirements.txt
          cd apps/relational-analyzer
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Quick smoke test
          python -c "import numpy, scipy, pandas, networkx; print('Dependencies loaded successfully')"
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update Python dependencies'
          title: '🔄 Update Python Dependencies'
          body: |
            ## Python Dependency Updates
            
            This PR updates Python dependencies to their latest compatible versions.
            
            ### Changes
            - Updated via pip-compile with `--upgrade` flag
            - Tested basic imports successfully
            
            ### Review Checklist
            - [ ] Review version changes
            - [ ] Run full test suite
            - [ ] Check for breaking changes in changelogs
            
            Auto-generated by dependency-update workflow
          branch: deps/python-auto-update
          delete-branch: true
          labels: |
            dependencies
            python
            automated
          assignees: ${{ github.repository_owner }}

  update-node:
    name: Update Node.js Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.target == 'both' || github.event.inputs.target == 'node'
    strategy:
      matrix:
        app:
          - name: dashboard
            path: apps/dashboard/frontend
          - name: mirror-os-app
            path: apps/mirror-os-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json
      
      - name: Update ${{ matrix.app.name }} dependencies
        working-directory: ${{ matrix.app.path }}
        run: |
          # Update to latest compatible versions
          npm update --save
          
          # Check for outdated packages
          npm outdated || true
      
      - name: Build test
        working-directory: ${{ matrix.app.path }}
        run: |
          npm ci
          npm run build
        continue-on-error: true
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update ${{ matrix.app.name }} Node.js dependencies'
          title: '🔄 Update ${{ matrix.app.name }} Node.js Dependencies'
          body: |
            ## Node.js Dependency Updates - ${{ matrix.app.name }}
            
            This PR updates Node.js dependencies to their latest compatible versions.
            
            ### Changes
            - Updated via `npm update`
            - Build test passed
            
            ### Review Checklist
            - [ ] Review version changes
            - [ ] Run full test suite
            - [ ] Check for breaking changes
            - [ ] Test locally
            
            Auto-generated by dependency-update workflow
          branch: deps/${{ matrix.app.name }}-node-auto-update
          delete-branch: true
          labels: |
            dependencies
            javascript
            ${{ matrix.app.name }}
            automated
          assignees: ${{ github.repository_owner }}