# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # Ignore major version updates for stable packages
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]

  # Relational analyzer Python dependencies
  - package-ecosystem: "pip"
    directory: "/apps/relational-analyzer"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "relational-analyzer"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"

  # NFL project Python dependencies
  - package-ecosystem: "pip"
    directory: "/projects/nfl-big-data-bowl-2026"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:30"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
      - "nfl-competition"

  # Dashboard frontend (Next.js)
  - package-ecosystem: "npm"
    directory: "/apps/dashboard/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
      - "dashboard"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    versioning-strategy: increase
    groups:
      # Group Next.js and React updates together
      nextjs:
        patterns:
          - "next"
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
      # Group TypeScript types together
      typescript-types:
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      # Group dev dependencies
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pin Next.js version to avoid breaking changes
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  # Mirror OS app
  - package-ecosystem: "npm"
    directory: "/apps/mirror-os-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
      - "mirror-os-app"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "ci/cd"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # Group actions from same organization
      actions:
        patterns:
          - "actions/*"
      github-actions:
        patterns:
          - "github/*"

  # Docker (if you add Dockerfiles later)
  - package-ecosystem: "docker"
    directory: "/apps/dashboard"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "03:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"

# Dependabot security updates are enabled by default
# They will create PRs for vulnerabilities immediately
