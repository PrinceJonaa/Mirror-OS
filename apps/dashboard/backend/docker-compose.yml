version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dashboard_db
      POSTGRES_USER: dashboard_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard_user -d dashboard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://dashboard_user:password@postgres:5432/dashboard_db
      DIAGNOSTIC_SCRIPT_PATH: /app/truth_distortion_unified.py
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /Users/princejona/a1:/workspace
    working_dir: /app
    command: python3.11 main.py

volumes:
  postgres_data: